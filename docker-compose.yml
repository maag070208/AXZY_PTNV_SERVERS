services:
  postgres:
    image: postgres:16-alpine
    container_name: ptnv-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cartas
      POSTGRES_USER: cartas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cartas_dev_pwd}
    volumes:
      - ptnv_pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cartas -d cartas"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: axzydev/axzy_ptnv_api:latest
    container_name: ptnv-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4001
      DATABASE_URL: postgresql://cartas:${POSTGRES_PASSWORD:-cartas_dev_pwd}@postgres:5432/cartas?schema=public
      JWT_SECRET: ${JWT_SECRET:-cambia_este_secreto_en_produccion}
      WEB_ORIGIN: "*"
      ABLY_API_KEY: ${ABLY_API_KEY:-}
      # Relojes checadores: usuario de los relojes (el mismo para todos). El
      # sistema solo les lee; los relojes se dan de alta desde la web.
      # Relojes checadores Hikvision (SOLO LECTURA). El API lee TIME_CLOCK_USER,
      # así que se le pasa con ese nombre el valor del `.env` (que usa el nombre
      # viejo CHECADOR_USER para no tener que cambiarlo en el servidor). El API
      # también acepta el nombre viejo como sinónimo.
      TIME_CLOCK_USER: ${CHECADOR_USER:-}
      TIME_CLOCK_PASS: ${CHECADOR_PASS:-}
      # Zona horaria de los reportes de entradas/salidas. Vacía = America/Mexico_City.
      ACCESS_REPORT_TIMEZONE: ${ACCESS_REPORT_TIMEZONE:-}
      # Archivos (evidencias de tickets, fotos y documentos del personal) en S3.
      # Sin bucket las subidas fallan; lo demás funciona.
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_BUCKET_NAME: ${AWS_BUCKET_NAME:-}
      AWS_REGION: ${AWS_REGION:-us-east-2}
    ports:
      - "4001:4001"
    # Al arrancar: aplica migraciones y levanta el API. El SEED no va aquí.
    #   - En una base con datos del cliente no debe tocar nada, y si la base
    #     quedara a medias el seed aborta y el API no arrancaría.
    #   - El seed es manual y de una sola vez (instalación nueva, base vacía):
    #     docker compose exec api npx prisma db seed
    # Se deja explícito (y no el CMD de la imagen) para no depender de la
    # versión de la imagen que haya en el servidor.
    command: >
      sh -c "npx prisma migrate deploy && node dist/src/index.js"

  web:
    image: axzydev/axzy_ptnv_web:latest
    container_name: ptnv-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      WEB_API_URL: ${WEB_API_URL:-/api/v1}
    ports:
      - "8080:80"

volumes:
  ptnv_pgdata:
